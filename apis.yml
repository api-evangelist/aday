name: Aday
description: 'Aday is a direct-to-consumer sustainable fashion brand founded in 2015
  in New York City by Nina Faulhaber and Meg He. It designs technical, long-lasting
  capsule wardrobes built for outfit repetition, using custom recycled fabrics (including
  post-consumer recycled plastic) and plant-based, beechwood-derived materials produced
  in closed-loop processes. Aday has raised more than $10 million in venture capital,
  is backed by Cowboy Ventures, and has been named one of Fast Company''s Most Innovative
  Companies, with coverage in Vogue, Refinery29, and Conde Nast Traveler. The company
  sells globally through its Shopify-powered storefront at thisisaday.com and does
  not publish a public developer API. This profile was created as an API Evangelist
  network stub from Cowboy Ventures'' portfolio and enriched with company identity
  and domain-security signals; the storefront returned a Shopify "store is unavailable"
  lock at the time of the enrichment probe.'
